{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="views-wrapper">

    <!-- =======================================================================
         CONTROL FLOTANTE DE SELECCIÓN DE PISO
         ======================================================================= -->
    <div class="map-floating-controls" aria-label="Controles de piso">
        <div class="floor-selector-dropdown">
            <button type="button" class="floor-selector-btn" id="floorSelectorBtn" aria-expanded="false" aria-haspopup="listbox" aria-label="Selector de piso. Piso 3 seleccionado" title="Seleccionar piso">
                <svg class="floor-selector-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <span class="floor-selector-label" id="currentFloorLabel">Piso 3</span>
                <svg class="floor-selector-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>

            <!-- Ahora es un menú "vacío": se llena desde map.js (setFloorOptions) -->
            <ul class="floor-dropdown-menu" id="floorDropdownMenu" role="listbox" aria-label="Pisos disponibles" hidden></ul>
        </div>
    </div>

    <!-- =======================================================================
         VISTA GENERAL DEL CAMPUS (DCC / BEAUCHEF 851)
         ======================================================================= -->
    <section id="vista-general" class="view-panel active" aria-label="Vista general del Departamento de Computación" tabindex="-1">

        <!-- Lienzo esquemático del campus -->
        <div class="schematic-canvas">
            <svg class="schematic-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680" role="img" aria-label="Plano esquemático del Campus DCC Beauchef 851">
                <defs>
                    <filter id="campus-card-shadow" x="-6%" y="-6%" width="112%" height="118%" filterUnits="userSpaceOnUse">
                        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#475569" flood-opacity="0.14" />
                    </filter>
                    <filter id="campus-hover-shadow" x="-8%" y="-8%" width="116%" height="122%" filterUnits="userSpaceOnUse">
                        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.28" />
                    </filter>
                </defs>

                <!-- 1. Conector físico entre edificios -->
                <rect x="135" y="165" width="46" height="34" fill="#B5BED1" stroke="#94A3B8" stroke-width="3" />
                <line x1="135" y1="168" x2="135" y2="198" stroke="#94A3B8" stroke-width="3" />
                <line x1="181" y1="168" x2="181" y2="198" stroke="#94A3B8" stroke-width="3" />

                <!-- 2. Edificio Poniente
                     data-edificio="Poniente": map.js lo lee con
                     edificio.dataset.edificio para saber qué edificio abrir;
                     debe coincidir con Piso.edificio en la BD. -->
                <g id="edificio-poniente" data-edificio="Poniente" class="interactive-building interactive-poniente" role="button" tabindex="0" aria-label="Edificio Poniente">
                    <rect class="building-bg poniente-bg" x="20" y="195" width="215" height="460" rx="18" fill="#B5BED1" stroke="#94A3B8" stroke-width="3" filter="url(#campus-card-shadow)" />
                    <!-- Tipografía vertical: Edificio Poniente -->
                    <text x="-565" y="92" transform="rotate(-90)" font-size="38" font-weight="700" fill="#475569" letter-spacing="1px" class="building-word-light">Edificio</text>
                    <text x="-565" y="166" transform="rotate(-90)" font-size="60" font-weight="900" fill="#334155" letter-spacing="2px" class="building-word-bold">Poniente</text>
                </g>

                <!-- 3. Identificador institucional Beauchef 851 -->
                <g id="campus-identity" aria-hidden="true">
                    <text x="340" y="445" font-size="54" font-weight="700" fill="#8E9DB5" letter-spacing="0.5px">Beauchef</text>
                    <text x="340" y="565" font-size="115" font-weight="900" fill="#8E9DB5" letter-spacing="1px">851</text>
                </g>

                <!-- 4. Edificio Norte
                     [CAMBIO] data-edificio="Norte" (ver comentario de Poniente). -->
                <g id="edificio-norte" data-edificio="Norte" class="interactive-building interactive-norte" role="button" tabindex="0" aria-label="Edificio Norte">
                    <rect class="building-bg norte-bg" x="20" y="20" width="580" height="150" rx="18" fill="#B5BED1" stroke="#94A3B8" stroke-width="3" filter="url(#campus-card-shadow)" />
                    <!-- Tipografía horizontal: Edificio Norte -->
                    <text x="137" y="110" font-size="44" font-weight="700" fill="#475569" letter-spacing="0.5px" class="building-word-light">Edificio</text>
                    <text x="304" y="110" font-size="64" font-weight="900" fill="#334155" letter-spacing="1px" class="building-word-bold">Norte</text>
                </g>
            </svg>
        </div>
    </section>

    <!-- =======================================================================
         [NUEVO] VISTA DE PISO
         Se muestra al hacer click en un edificio (sin .active hasta entonces).
         - data-url-pisos / data-url-piso: URLs de la API generadas con la etiqueta url de Django
           para no depender del prefijo con que se incluya core.urls. map.js
           reemplaza el texto EDIFICIO (y el 0 final) por los valores reales.
         - #floorSvg: aquí renderFloor() dibuja un <rect> por sala.
         - #roomPanel: detalle de la sala clickeada (profesores).
           aria-live="polite" hace que lectores de pantalla anuncien el cambio.
         ======================================================================= -->
    <section id="vista-piso" class="view-panel" aria-label="Plano del piso" tabindex="-1"
             data-url-pisos="{% url 'core:pisos_edificio' 'EDIFICIO' %}"
             data-url-piso="{% url 'core:piso_json' 'EDIFICIO' 0 %}">
        <button type="button" id="backToGeneral" class="floor-back-btn">← Volver al campus</button>
        <h2 id="floorTitle" class="floor-title"></h2>
        <div class="floor-canvas">
            <svg id="floorSvg" class="floor-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plano del piso"></svg>
        </div>
        <aside id="roomPanel" class="room-panel" aria-live="polite"></aside>
    </section>

</div>
{% endblock %}
